name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os-name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os-name: Windows
            runner: windows-latest
            artifact-prefix: SVGIconStudio-Windows
          - os-name: macOS
            runner: macos-latest
            artifact-prefix: SVGIconStudio-macOS

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Basic checks
        run: |
          python -B scripts/check_syntax.py
          python -B scripts/check_locales.py
          python -B scripts/check_resources.py
          python -B scripts/prepare_icons.py --require
          python -B -c "import svg_icon_studio.app; import svg_icon_studio.ui.main_window; print('Import check passed.')"

      - name: Build executable
        run: pyinstaller --noconfirm --clean SVGIconStudio.spec

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path dist/SVGIconStudio -DestinationPath "release/${{ matrix.artifact-prefix }}-${{ github.ref_name }}.zip"

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p release
          ditto -c -k --keepParent dist/SVGIconStudio.app "release/${{ matrix.artifact-prefix }}-${{ github.ref_name }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-prefix }}
          path: release/${{ matrix.artifact-prefix }}-${{ github.ref_name }}.zip

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
