name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_LABEL: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}

jobs:
  build:
    name: Build ${{ matrix.os-name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os-name: Windows
            runner: windows-latest
            artifact-prefix: SVGIconStudio-Windows
          - os-name: macOS
            runner: macos-latest
            artifact-prefix: SVGIconStudio-macOS

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Basic checks
        run: |
          python -B scripts/check_syntax.py
          python -B scripts/check_locales.py
          python -B scripts/check_resources.py
          python -B scripts/prepare_icons.py --require
          python -B -c "import svg_icon_studio.app; import svg_icon_studio.ui.main_window; print('Import check passed.')"

      - name: Regression tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -B -m unittest discover -s tests -v

      - name: Build executable
        run: pyinstaller --noconfirm --clean SVGIconStudio.spec

      - name: Smoke test Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $process = Start-Process -FilePath "dist/SVGIconStudio/SVGIconStudio.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged application self-test failed" }

      - name: Smoke test macOS bundle
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        run: dist/SVGIconStudio.app/Contents/MacOS/SVGIconStudio --self-test

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path dist/SVGIconStudio -DestinationPath "release/${{ matrix.artifact-prefix }}-${env:BUILD_LABEL}.zip"

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p release
          ditto -c -k --keepParent dist/SVGIconStudio.app "release/${{ matrix.artifact-prefix }}-${BUILD_LABEL}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.artifact-prefix }}
          path: release/${{ matrix.artifact-prefix }}-${{ env.BUILD_LABEL }}.zip

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    name: Create Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: release
          merge-multiple: true

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release/*.zip
